[project]
name = "dear-job-seeker"
version = "0.1.0"
description = "Local MCP job crawler: public sites + login-required sites (Boss) with your own cookie."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27", "playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
djs = "djs.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["djs*"]

[tool.setuptools.package-data]
djs = ["schema.sql"]
