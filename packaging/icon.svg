<!-- App icon: the logo of the app's top bar (djs/ui/index.html) on the macOS icon grid (824 px of 1024).
     Regenerate icon.icns / icon.ico from it: render at 1024 px with a transparent background, then
     `sips -z` the iconset sizes + `iconutil -c icns`, and pack PNGs of 16-256 px into icon.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F63F2"/>
      <stop offset="1" stop-color="#6A3BD8"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(26) translate(-12.5 -12.5)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
    <circle cx="11" cy="11" r="6"/>
    <path d="m20 20-4-4"/>
  </g>
</svg>
